<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shift</title>
<link rel="icon" href="data:," id="favIcon">
<link rel="apple-touch-icon" id="appleIcon" href="data:,">
<meta name="theme-color" content="#019BDB" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift" id="appTitleMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#E7F4FB;
    --surface:#FFFFFF;
    --ink:#16202A;
    --ink-soft:#4B5763;
    --line:#D7DBDD;
    --navy:#0A6E9E;
    --navy-deep:#019BDB;
    --amber:#FBC913;
    --amber-ink:#5A3A08;
    --red:#E2024B;
    --green:#2F7D5C;
    --brand-orange:#EB5429;
    --on-deep:#16202A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:16px 18px 14px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:3px solid var(--amber);
  }
  header.topbar .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header.topbar h1{
    font-size:19px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.topbar .sub{
    font-size:12.5px;
    color:#B9C6D6;
    margin-top:2px;
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    background:rgba(255,255,255,0.08);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    border:none;
    color:#fff;
    font-family:inherit;
  }
  .user-chip .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
  }

  /* ---------- Main / views ---------- */
  main{
    flex:1;
    padding:0 0 90px;
  }
  .view{display:none;}
  .view.active{display:block;}

  h2.section-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
  }
  p.section-hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  /* ---------- Auth screens ---------- */
  .onboard-wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 24px;
    max-width:480px;
    margin:0 auto;
  }
  .onboard-mark{
    width:52px;height:52px;border-radius:12px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    border-bottom:4px solid var(--amber);
  }
  .onboard-mark span{
    font-family:'Archivo Black';
    color:var(--amber);
    font-size:22px;
  }
  .onboard-mark-img{ width:64px; height:64px; border-radius:16px; object-fit:cover; margin-bottom:18px; }
  .onboard-wrap h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .onboard-wrap p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 26px;
    line-height:1.5;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  label.field-label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  label.field-label:first-child{ margin-top:0; }
  input[type=text], input[type=password], input[type=email]{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:inherit;
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
  }
  .field-row{ display:flex; gap:8px; align-items:flex-end; }
  .field-row > div{ flex:1; }
  .btn-ghost-sm{
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    cursor:pointer;
    white-space:nowrap;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .btn-primary{
    width:100%;
    margin-top:20px;
    padding:13px;
    border-radius:10px;
    border:none;
    background:var(--amber);
    color:var(--amber-ink);
    font-family:inherit;
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.45; }
  .btn-secondary{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .err-msg{
    color:var(--red);
    font-size:13px;
    margin-top:8px;
    font-weight:600;
  }
  .info-msg{
    color:var(--green);
    font-size:13px;
    margin-top:8px;
    font-weight:600;
  }
  .switch-user-link{
    background:none;border:none;color:var(--ink-soft);
    font-family:inherit;font-size:12px;text-decoration:underline;
    cursor:pointer;padding:0;margin-top:18px;
  }

  /* ---------- Calendar ---------- */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .month-nav .label{
    font-weight:800;
    font-size:15.5px;
    text-transform:capitalize;
  }
  .month-nav button{
    width:34px;height:34px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:16px;
    cursor:pointer;
    color:var(--navy);
    font-weight:700;
  }
  .month-nav button:disabled{ opacity:0.35; cursor:not-allowed; }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:6px;
  }
  .weekday-row div{
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-day{
    aspect-ratio:1;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    position:relative;
  }
  .cal-day.empty{visibility:hidden; cursor:default;}
  .cal-day.available{background:var(--green); border-color:var(--green); color:#fff;}
  .cal-day.unavailable{background:var(--red); border-color:var(--red); color:#fff;}
  .cal-day .shift-dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--amber);
    position:absolute;
    bottom:5px;
  }
  .cal-day .count-badge{
    position:absolute;
    top:3px; right:3px;
    background:var(--brand-orange);
    color:#fff;
    font-size:9px;
    font-weight:800;
    border-radius:8px;
    padding:1px 4px;
    line-height:1.3;
  }
  .cal-day .avail-badge{
    position:absolute;
    top:3px; left:3px;
    background:var(--green);
    color:#fff;
    font-size:9px;
    font-weight:800;
    border-radius:8px;
    padding:1px 4px;
    line-height:1.3;
  }
  .legend{
    display:flex;
    gap:16px;
    margin-top:16px;
    font-size:12px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;}

  /* ---------- Confirm banner ---------- */
  .confirm-box{
    margin-top:18px;
    padding:14px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--surface);
  }
  .confirm-box.confirmed{
    border-color:var(--green);
    background:#EAF5EF;
  }
  .confirm-box .cf-title{
    font-weight:800;
    font-size:13.5px;
    margin-bottom:3px;
  }
  .confirm-box.confirmed .cf-title{ color:var(--green); }
  .confirm-box .cf-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .confirm-box button{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:none;
    background:var(--navy);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:13.5px;
    cursor:pointer;
  }
  .confirm-box button:disabled{ opacity:0.4; cursor:default; }

  /* ---------- Modal (planning day detail) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(15,20,26,0.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:60;
  }
  .modal-card{
    background:#fff;
    width:100%;
    max-width:480px;
    max-height:82vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:4px;
  }
  .modal-date{ font-weight:800; font-size:16px; text-transform:capitalize; }
  .modal-close{
    background:var(--bg); border:none; width:30px; height:30px; border-radius:50%;
    font-size:16px; font-weight:800; color:var(--ink-soft); cursor:pointer;
  }
  .modal-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .staff-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .staff-row:last-child{ border-bottom:none; }
  .staff-row .sr-name{ font-weight:700; font-size:14px; }
  .staff-row .sr-status{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .staff-row .sr-status.avail{ color:var(--green); }
  .staff-row .sr-status.unavail{ color:var(--red); }
  .check-btn{
    width:30px; height:30px; border-radius:50%;
    border:2px solid var(--line);
    background:#fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .check-btn svg{ width:16px; height:16px; stroke:#fff; display:none; }
  .check-btn.checked{
    background:var(--green);
    border-color:var(--green);
  }
  .check-btn.checked svg{ display:block; }

  /* ---------- Planning ---------- */
  .no-users-hint{
    font-size:13px; color:var(--ink-soft); padding:14px; text-align:center;
  }

  /* ---------- Beheer (admin users) ---------- */
  .user-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
    gap:10px;
  }
  .user-row:last-child{ border-bottom:none; }
  .user-row .u-name{ font-weight:700; font-size:14px; }
  .user-row .u-email{ font-size:12px; color:var(--ink-soft); }
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800;
    padding:2px 7px; border-radius:8px; margin-left:6px;
    vertical-align:middle;
  }
  .badge.admin{ background:var(--navy); color:#fff; }
  .badge.pending{ background:var(--amber); color:var(--amber-ink); }
  .reset-panel{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  }

  /* ---------- Messages ---------- */
  .msg-compose{ display:flex; gap:8px; margin-bottom:18px; }
  .msg-compose textarea{
    flex:1; resize:none; border-radius:10px; border:1.5px solid var(--line);
    padding:10px 12px; font-family:inherit; font-size:14px; min-height:46px; color:var(--ink);
  }
  .msg-compose button{
    border:none; background:var(--navy); color:#fff; border-radius:10px;
    padding:0 16px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .msg-item{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px;
  }
  .msg-item .m-head{ display:flex; justify-content:space-between; margin-bottom:5px; }
  .msg-item .m-author{ font-weight:800; font-size:13px; color:var(--navy); }
  .msg-item .m-time{ font-size:11px; color:var(--ink-soft); }
  .msg-item .m-text{ font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }

  /* ---------- Bottom nav ---------- */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; font-family:inherit; font-size:11px; font-weight:700;
    color:var(--ink-soft); padding:6px 2px 2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar button .ic{ width:20px; height:20px; }
  nav.tabbar button.active{ color:var(--navy); }
  nav.tabbar button.active .ic svg{ stroke:var(--navy); }

  .loading-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:13.5px;
  }

  /* ---------- New shell (Home/Werktijden/Beschikbaarheid/Meer) ---------- */
  .topbar2{
    background:var(--navy-deep); color:var(--on-deep); padding:12px 16px 12px;
    position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(0,0,0,0.12);
  }
  .topbar2 .row{ display:flex; align-items:center; justify-content:space-between; }
  .topbar2 h1{ font-size:19px; font-weight:800; margin:0; flex:1; text-align:center; }
  .bell-btn{ background:none; border:none; color:var(--on-deep); cursor:pointer; padding:4px; width:28px; }
  .bell-btn svg{ width:22px; height:22px; }
  .header-logo{ width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0; display:block; border:2px solid rgba(255,255,255,0.55); }
  .spacer28{ width:28px; flex-shrink:0; }

  .date-strip{ display:flex; gap:6px; overflow-x:auto; padding:14px 12px 6px; }
  .date-pill{
    flex:1 1 0; min-width:0; padding:9px 4px; border-radius:12px; border:1.5px solid transparent;
    background:transparent; text-align:center; cursor:pointer; font-family:inherit; color:var(--ink-soft);
  }
  .date-pill .dnum{ font-size:11px; font-weight:600; display:block; }
  .date-pill .dday{ font-size:16px; font-weight:800; display:block; color:var(--ink); margin-top:2px; }
  .date-pill.selected{ background:#fff; border-color:var(--line); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .date-pill.selected .dday{ color:var(--navy); }
  .date-pill.has-shift .dday::after{ content:''; display:block; width:5px; height:5px; border-radius:50%; background:var(--amber); margin:3px auto 0; }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; padding:2px 16px 0; }
  .week-nav button{ background:none; border:none; color:var(--navy); font-size:15px; font-weight:800; cursor:pointer; padding:6px; }
  .week-nav .wn-label{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }

  .shift-panel{
    margin:14px 16px 8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 16px; display:flex; align-items:center; gap:10px; justify-content:center;
    color:var(--ink-soft); font-weight:600; font-size:14.5px; text-align:center;
  }
  .shift-panel svg{ width:19px; height:19px; flex-shrink:0; }
  .shift-list{ margin:14px 16px 8px; display:flex; flex-direction:column; gap:8px; }
  .shift-chip{
    background:#EAF5EF; border:1px solid var(--green); color:var(--green); border-radius:12px;
    padding:12px 14px; font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:space-between;
  }

  .news-section{ padding:6px 16px 24px; }
  .news-heading{ font-size:13.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 8px; }
  .news-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; cursor:pointer; }
  .news-card .n-author{ font-weight:800; font-size:13px; color:var(--navy); }
  .news-card .n-time{ font-size:11px; color:var(--ink-soft); margin-left:6px; }
  .news-card .n-text{ font-size:13.5px; margin-top:6px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .subtabs{ display:flex; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:70px; z-index:15; }
  .subtabs button{ flex:1; background:none; border:none; padding:13px 4px; font-family:inherit; font-weight:700; font-size:14px; color:var(--ink-soft); border-bottom:2.5px solid transparent; cursor:pointer; }
  .subtabs button.active{ color:var(--navy); border-color:var(--navy); }

  .tab-body-pad{ padding-top:16px; padding-bottom:24px; }

  .entry-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 16px 8px; }
  .entry-row .e-date{ font-weight:700; font-size:13.5px; text-transform:capitalize; }
  .entry-row .e-right{ display:flex; align-items:center; gap:10px; }
  .status-badge{ font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:8px; white-space:nowrap; }
  .status-badge.avail{ background:#EAF5EF; color:var(--green); }
  .status-badge.unavail{ background:#FBEAE9; color:var(--red); }
  .del-btn{ background:none; border:none; color:var(--ink-soft); font-size:17px; font-weight:800; cursor:pointer; padding:0 2px; line-height:1; }

  .sticky-cta-wrap{ position:sticky; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 65%, transparent); margin-top:8px; }
  .cta-green{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--green); color:#fff; font-family:inherit; font-weight:800; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }

  .add-form{ margin:8px 16px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .radio-row{ display:flex; gap:10px; margin-top:8px; }
  .radio-opt{ flex:1; text-align:center; padding:11px; border-radius:10px; border:1.5px solid var(--line); font-weight:700; font-size:13px; cursor:pointer; color:var(--ink-soft); background:#fff; }
  .radio-opt.selected.avail{ background:#EAF5EF; border-color:var(--green); color:var(--green); }
  .radio-opt.selected.unavail{ background:#FBEAE9; border-color:var(--red); color:var(--red); }
  .form-btn-row{ display:flex; gap:8px; margin-top:16px; }
  .form-btn-row .cta-green{ margin:0; }
  .form-btn-row .btn-cancel{ flex:0 0 auto; padding:0 18px; border-radius:12px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; }

  .weekday-pattern-card{ margin:8px 16px 16px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .weekday-pattern-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
  .weekday-pattern-row:last-child{ border-bottom:none; }
  .weekday-pattern-row .wp-label{ font-weight:600; font-size:14.5px; }
  .switch{ position:relative; width:44px; height:26px; flex-shrink:0; display:inline-block; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{ position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:.15s; }

<script>
const MAANDEN=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const DAGEN=['ma','di','wo','do','vr','za','zo'];
const DEFAULT_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0A6E9E"/><path d="M18 24h24l-7-7M46 40H22l7 7" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
const DEFAULT_BRAND={ id:null, slug:null, name:'Shift', legal_name:null, logo:null, color_primary:'#0A6E9E', color_secondary:'#019BDB', color_accent:'#FBC913', active:true };
function brandLogo(){ return (state.tenant&&state.tenant.logo)||DEFAULT_LOGO; }
function brandName(){ return (state.tenant&&state.tenant.name)||'Shift'; }
function brandLegal(){ const t=state.tenant; return t&&t.legal_name ? t.name+' / '+t.legal_name : brandName(); }
function brandSlugFile(){ return (state.tenant&&state.tenant.slug)||'shift'; }
function hexToRgb(h){ h=String(h||'').replace('#',''); if(h.length!==6) return [0,0,0]; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rgbToHex(r){ return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function lumi(h){ const [r,g,b]=hexToRgb(h).map(v=>{ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; }
function readableOn(h){ return lumi(h)>0.35 ? '#16202A' : '#FFFFFF'; }
function mixHex(h,w,t){ const a=hexToRgb(h), b=hexToRgb(w); return rgbToHex(a.map((v,i)=>v+(b[i]-v)*t)); }
function applyBranding(t){
  t=Object.assign({},DEFAULT_BRAND,t||{});
  state.tenant=t;
  const st=document.documentElement.style;
  st.setProperty('--navy',t.color_primary);
  st.setProperty('--navy-deep',t.color_secondary);
  st.setProperty('--amber',t.color_accent);
  st.setProperty('--amber-ink',readableOn(t.color_accent));
  st.setProperty('--on-deep',readableOn(t.color_secondary));
  st.setProperty('--bg',mixHex(t.color_secondary,'#FFFFFF',0.9));
  document.title=t.name;
  const set=(id,attr,val)=>{ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); };
  set('appleIcon','href',brandLogo()); set('favIcon','href',brandLogo());
  set('themeColor','content',t.color_secondary); set('appTitleMeta','content',t.name);
  try{
    const abs=location.origin+location.pathname+(t.slug?'?k='+encodeURIComponent(t.slug):'');
    const man={ name:t.name, short_name:t.name.slice(0,12), start_url:abs, scope:location.origin+location.pathname, display:'standalone', background_color:mixHex(t.color_secondary,'#FFFFFF',0.9), theme_color:t.color_secondary, icons:[{src:brandLogo(),sizes:'192x192'},{src:brandLogo(),sizes:'512x512'}] };
    let link=document.getElementById('manifestLink');
    if(!link){ link=document.createElement('link'); link.rel='manifest'; link.id='manifestLink'; document.head.appendChild(link); }
    link.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  }catch(e){}
  if(t.slug){ try{ localStorage.setItem('shift-tenant',t.slug); }catch(e){} }
}
function rememberedSlug(){
  try{ const u=new URLSearchParams(location.search).get('k'); if(u) return u.toLowerCase().trim(); }catch(e){}
  try{ return localStorage.getItem('shift-tenant')||null; }catch(e){ return null; }
}
function forgetSlug(){ try{ localStorage.removeItem('shift-tenant'); }catch(e){} }

function mondayNow(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }

let state={

  users:[],
  availability:{},
  timeEntries:[],
  kioskSecret:null,
  paidHours:{},
  ledgerMonthKey:null,
  contractWeekStart:mondayNow(),
  liantisEmail:'',
  planPrefs:null,
  tenant:null,
  impersonatingFrom:null,
  impersonatingSession:null,
  schedule:{},
  messages:[],
  activeTab:'home',
  meerSubView:null,
  homeSelectedDate:null,

  werktijdenWeekStart:mondayNow(),
  adminGridWeekStart:mondayNow(),

  werktijdenSelectedDate:null,

  calMonth:new Date().getMonth(),
  calYear:new Date().getFullYear(),
};

// ==== VUL HIER JE SUPABASE-GEGEVENS IN (zie instructies) ====
const SUPABASE_URL = 'https://gvoawcmvvrraozwzxlbn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vj2MrAXUipG5CEvOFQW1kg_krSX6EaY';   // publieke sleutel: mag in de browser staan
// ================================================================
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function dateKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function ymKey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function genTempPassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let out='';
  for(let i=0;i<8;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function escapeHtml(str){
  const d=document.createElement('div'); d.textContent=str; return d.innerHTML;
}
async function sha256Hex(str){
  const enc=new TextEncoder().encode(str);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function currentJwt(){
  const { data } = await sb.auth.getSession();
  return data && data.session ? data.session.access_token : null;
}
async function callEdgeFunction(name, payload){
  const jwt = await currentJwt();
  try{
    const res = await fetch(SUPABASE_URL+'/functions/v1/'+name, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+jwt, apikey:SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){ return { success:false, error:String(e) }; }
}

// Supabase geeft standaard maximaal 1000 rijen per aanvraag terug: grotere tabellen pagineren we dus zelf,
// anders ontbreken stilzwijgend oudere (of nieuwere) registraties.
async function fetchAll(table, cols, orders){
  const out=[]; const size=1000;
  for(let from=0; ; from+=size){
    let q=sb.from(table).select(cols);
    (orders||[]).forEach(o=>{ q=q.order(o); });
    const { data, error } = await q.range(from, from+size-1);
    if(error) return { data:out, error };
    out.push(...(data||[]));
    if(!data || data.length<size) break;
  }
  return { data:out, error:null };
}

async function loadAll(){
  const uidMe = state.currentUser ? state.currentUser.id : null;

  const [profilesRes, availRes, schedRes, msgRes, timeRes, paidRes, kioskRes, settingsRes, personalRes] = await Promise.all([
    sb.from('profiles').select('id,name,email,is_admin,is_kiosk,must_change_password'),
    fetchAll('availability','user_id,date',['user_id','date']),
    fetchAll('schedule','date,user_id',['date','user_id']),
    sb.from('messages').select('id,author_name,text,created_at').order('created_at',{ascending:false}).limit(150),
    fetchAll('time_entries','id,user_id,type,ts,manual',['ts','id']),
    fetchAll('paid_hours','user_id,week_start,hours',['user_id','week_start']),
    sb.from('kiosk_secret').select('secret').maybeSingle(),
    sb.from('app_settings').select('key,value'),
    sb.from('personal_data').select('user_id,last_name,first_name,birth_date,street,postal,city'),
  ]);

  state.users = (profilesRes.data||[]).map(p=>({
    id:p.id, name:p.name, email:p.email,
    isAdmin:p.is_admin, isKiosk:p.is_kiosk, mustChangePassword:p.must_change_password
  }));
  (personalRes.data||[]).forEach(r=>{
    const u=state.users.find(x=>x.id===r.user_id);
    if(u) u.personal={ lastName:r.last_name, firstName:r.first_name, birthDate:r.birth_date, street:r.street, postal:r.postal, city:r.city, completed:true };
  });

  state.availability = {};
  (availRes.data||[]).forEach(row=>{
    if(!state.availability[row.user_id]) state.availability[row.user_id]={};
    state.availability[row.user_id][row.date]='available';
  });

  state.schedule = {};
  (schedRes.data||[]).forEach(row=>{
    if(!state.schedule[row.date]) state.schedule[row.date]=[];
    state.schedule[row.date].push({staffId:row.user_id});
  });

  state.messages = (msgRes.data||[]).map(m=>({ id:m.id, author:m.author_name, text:m.text, ts:new Date(m.created_at).getTime() }));

  state.timeEntries = (timeRes.data||[]).map(t=>({ id:t.id, userId:t.user_id, type:t.type, ts:new Date(t.ts).getTime(), manual:t.manual }));

  state.paidHours = {};
  (paidRes.data||[]).forEach(row=>{
    if(!state.paidHours[row.user_id]) state.paidHours[row.user_id]={};
    state.paidHours[row.user_id][row.week_start]=Number(row.hours);
  });

  state.kioskSecret = kioskRes.data ? kioskRes.data.secret : null;

  const liantisRow=(settingsRes.data||[]).find(r=>r.key==='liantis_email');
  state.liantisEmail = liantisRow ? liantisRow.value : '';
  const ppRow=(settingsRes.data||[]).find(r=>r.key==='planning_prefs');
  try{ state.planPrefs = ppRow ? JSON.parse(ppRow.value) : null; }catch(e){ state.planPrefs=null; }

  if(uidMe){
    const fresh=state.users.find(u=>u.id===uidMe);
    if(fresh) state.currentUser=fresh;
  }
}

const PROFILE_COLS='id,name,email,is_admin,is_kiosk,must_change_password';
function userFromProfile(p){ return { id:p.id, name:p.name, email:p.email, isAdmin:p.is_admin, isKiosk:p.is_kiosk, mustChangePassword:p.must_change_password }; }
async function fetchBranding(slug){
  try{ const { data } = await sb.rpc('get_branding',{ p_slug:slug }); return data||null; }catch(e){ return null; }
}
async function fetchMyProfile(authId){
  const { data: brand } = await sb.rpc('get_my_branding');
  if(!brand) return { error:'noprofile' };
  const { data: profile } = await sb.from('profiles').select(PROFILE_COLS).eq('id', authId).maybeSingle();
  return { brand, profile };
}

async function init(){
  if(SUPABASE_URL.indexOf('YOUR-PROJECT')!==-1 || SUPABASE_ANON_KEY.indexOf('YOUR-ANON-KEY')!==-1){
    renderSetupNeeded();
    return;
  }
  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData && sessionData.session){
    const r = await fetchMyProfile(sessionData.session.user.id);
    if(r.error){ await sb.auth.signOut(); return startLoggedOut(); }
    applyBranding(r.brand);
    if(!r.brand.active){ renderBlocked(); return; }
    if(!r.profile){ await sb.auth.signOut(); return startLoggedOut(); }
    state.currentUser = userFromProfile(r.profile);
    if(state.currentUser.mustChangePassword){
      renderSetNewPassword(state.currentUser);
      return;
    }
    await loadAll();
    dispatchAfterLogin();
  } else {
    await startLoggedOut();
  }
}

async function startLoggedOut(msg){
  const slug = rememberedSlug();
  if(!slug){ applyBranding(DEFAULT_BRAND); renderCompanyCode(msg); return; }
  const b = await fetchBranding(slug);
  if(!b){ forgetSlug(); applyBranding(DEFAULT_BRAND); renderCompanyCode('Onbekende bedrijfscode "'+slug+'".'); return; }
  applyBranding(b);
  renderLogin();
}

async function handleLogin(){
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw=document.getElementById('loginPw').value;
  const fail=(m)=>{ errEl.textContent=m; errEl.style.display='block'; };
  if(!email || !pw){ fail('Vul e-mailadres en wachtwoord in.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error || !data.user){ fail('Onjuiste e-mail of wachtwoord.'); return; }
  const r = await fetchMyProfile(data.user.id);
  if(r.error || !r.profile && r.brand && r.brand.active){
    await sb.auth.signOut();
    fail('Account niet volledig aangemaakt. Contacteer de administrator.');
    return;
  }
  // Dit account moet bij DEZE klant horen (de bedrijfscode in de link/het scherm).
  if(state.tenant && state.tenant.id && r.brand.id!==state.tenant.id){
    await sb.auth.signOut();
    fail('Dit account hoort niet bij '+state.tenant.name+'. Kies "Ander bedrijf?" om de juiste omgeving te openen.');
    return;
  }
  applyBranding(r.brand);
  if(!r.brand.active){ await sb.auth.signOut(); renderBlocked(); return; }
  const user=userFromProfile(r.profile);
  if(user.mustChangePassword){ renderSetNewPassword(user); return; }
  await logInAs(user);
}

const PD_FIELDS=[['lastName','Naam','text','Achternaam'],['firstName','Voornaam','text','Voornaam'],['birthDate','Geboortedatum','date',''],['street','Straat en huisnummer','text','Bv. Dorpsstraat 12 bus 3'],['postal','Postcode','text','Bv. 2000'],['city','Gemeente','text','Bv. Antwerpen']];
function needsPersonalData(u){
  if(!u || u.isKiosk || u.isAdmin || u.isVirtual || state.impersonatingFrom) return false;
  const fresh=state.users.find(x=>x.id===u.id);
  const p=(fresh&&fresh.personal)||u.personal;
  return !(p && p.completed);
}
function personalFormHtml(p, pre){
  p=p||{};
  return PD_FIELDS.map(([k,label,type,ph],i)=>'<label class="field-label"'+(i===0?' style="margin-top:0;"':'')+'>'+label+'</label><input type="'+type+'" id="'+pre+k+'" value="'+escapeHtml(p[k]||'')+'" placeholder="'+escapeHtml(ph)+'"'+(type==='date'?' max="'+toDateKeyFromDate(new Date())+'" style="width:100%; padding:12px 14px; font-size:15px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; background:#fff; box-sizing:border-box;"':'')+' autocomplete="off">').join('');
}
function readPersonalForm(pre){
  const data={};
  for(const [k,label] of PD_FIELDS){
    const v=document.getElementById(pre+k).value.trim();
    if(!v) return {error:'Vul "'+label+'" in.'};
    data[k]=v;
  }
  if(!/^\d{4}$/.test(data.postal)) return {error:'Een Belgische postcode bestaat uit 4 cijfers.'};
  return {data};
}

async function savePersonalData(userId, data){
  const { error } = await sb.from('personal_data').upsert({
    user_id:userId, last_name:data.lastName, first_name:data.firstName, birth_date:data.birthDate,
    street:data.street, postal:data.postal, city:data.city });
  if(error) return 'Opslaan mislukt: '+error.message;
  const u=state.users.find(x=>x.id===userId);
  if(u) u.personal=Object.assign({}, data, {completed:true});
  if(state.currentUser && state.currentUser.id===userId) state.currentUser.personal=Object.assign({}, data, {completed:true});
  return null;
}

async function impersonateRealUser(userId){
  const { data: sessionData } = await sb.auth.getSession();
  if(!sessionData || !sessionData.session) return;
  const result = await callEdgeFunction('admin-impersonate', { targetUserId:userId });
  if(!result.success){ showMessage(result.error || 'Kon niet inloggen als deze medewerker.'); return; }
  const { data: verified, error: verErr } = await sb.auth.verifyOtp({ token_hash: result.hashed_token, type:'email' });
  if(verErr || !verified || !verified.session){
    showMessage('Kon geen sessie starten voor deze medewerker.');
    return;
  }
  if(!state.impersonatingSession){
    state.impersonatingSession = sessionData.session;
    state.impersonatingFrom = state.currentUser;
  }
  const { data: profile } = await sb.from('profiles').select('id,name,email,is_admin,is_kiosk,must_change_password').eq('id', userId).maybeSingle();
  state.currentUser = profile
    ? { id:profile.id, name:profile.name, email:profile.email, isAdmin:profile.is_admin, isKiosk:profile.is_kiosk, mustChangePassword:profile.must_change_password }
    : state.currentUser;
  await loadAll();
  document.getElementById('modalRoot') && (document.getElementById('modalRoot').innerHTML='');
  dispatchAfterLogin();
}

async function restoreFromImpersonation(){
  if(!state.impersonatingFrom) return;
  if(state.impersonatingSession){
    await sb.auth.setSession(state.impersonatingSession);
    state.impersonatingSession=null;
    state.currentUser=state.impersonatingFrom;
    state.impersonatingFrom=null;
    await loadAll();
  } else {
    state.currentUser=state.impersonatingFrom;
    state.impersonatingFrom=null;
  }
  dispatchAfterLogin();
}

/* In-app dialogen (de ingebouwde confirm()/alert() worden in veel previews/webviews geblokkeerd) */
function askConfirm(message, okLabel){
  return new Promise(resolve=>{
    const root=document.getElementById('modalRoot')||document.body;
    const ov=document.createElement('div'); ov.className='modal-overlay'; ov.style.zIndex=90;
    ov.innerHTML='<div class="modal-card"><div style="font-size:16px; font-weight:700; margin:6px 0 16px;">'+escapeHtml(message)+'</div><div class="form-btn-row"><button class="btn-cancel" id="acNo">Annuleren</button><button class="cta-green" id="acYes">'+escapeHtml(okLabel||'Ja')+'</button></div></div>';
    root.appendChild(ov);

    ov.querySelector('#acNo').onclick=()=>done(false);
    ov.querySelector('#acYes').onclick=()=>done(true);
    ov.addEventListener('click',e=>{ if(e.target===ov) done(false); });

}
function showMessage(message){
  return new Promise(resolve=>{
    const root=document.getElementById('modalRoot')||document.body;
    const ov=document.createElement('div'); ov.className='modal-overlay'; ov.style.zIndex=90;
    ov.innerHTML='<div class="modal-card"><div style="font-size:15px; margin:6px 0 16px; user-select:text;">'+escapeHtml(message)+'</div><div class="form-btn-row"><button class="cta-green" id="smOk">OK</button></div></div>';
    root.appendChild(ov);
    const done=()=>{ ov.remove(); resolve(); };
    ov.querySelector('#smOk').onclick=done;
    ov.addEventListener('click',e=>{ if(e.target===ov) done(); });
  });
}

function shiftMonth(delta){
  state.calMonth+=delta;
  if(state.calMonth<0){state.calMonth=11; state.calYear--;}
  if(state.calMonth>11){state.calMonth=0; state.calYear++;}
}

function drawPlanningCalendar(){
  const y=state.calYear, m=state.calMonth;
  document.getElementById('pMonthLabel').textContent = MAANDEN[m]+' '+y;
  const grid=document.getElementById('pCalGrid');
  grid.innerHTML='';
  const first=new Date(y,m,1);
  let startDow=first.getDay();
  startDow = startDow===0 ? 6 : startDow-1;
  const daysInMonth=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const key=dateKey(y,m,d);
    const count=(state.schedule[key]||[]).length;
    const availCount=state.users.filter(u=>(state.availability[u.id]||{})[key]==='available').length;
    const cell=document.createElement('div');
    cell.className='cal-day';
    cell.innerHTML='<span>'+d+'</span>'
      +(count>0?'<span class="count-badge">'+count+'</span>':'')
      +(availCount>0?'<span class="avail-badge">'+availCount+'</span>':'');
    cell.onclick=()=>openDayModal(y,m,d);
    grid.appendChild(cell);
  }
}function openDayModal(y,m,d){
  const key=dateKey(y,m,d);
  const ym=ymKey(y,m);

  if(list.length===0){

  function draw(){
    rowsEl.innerHTML='';
    const assignedList = state.schedule[key] || [];
    list.forEach(u=>{

const KIOSK_WINDOW_MS = 15*60*1000;

async function ensureKioskSecret(){
  if(state.kioskSecret) return state.kioskSecret;
  const secret = randomSalt()+randomSalt();
  const { error } = await sb.from('kiosk_secret').upsert({ tenant_id:state.tenant.id, secret });
  if(!error) state.kioskSecret = secret;
  else {
    // mogelijk al aangemaakt door een andere sessie ondertussen — gewoon opnieuw ophalen
    const { data } = await sb.from('kiosk_secret').select('secret').maybeSingle();
    state.kioskSecret = data ? data.secret : null;
  }
  return state.kioskSecret;
}

async function computeKioskToken(windowIndex){

}

/* ---- clock in/out (staff side) ---- */
const MAX_SESSION_MS=14*3600000;   // een sessie langer dan 14u = vergeten uit te klokken
const MIN_RESCAN_MS=60*1000;       // dubbele scan binnen 1 minuut wordt genegeerd
function getClockStatus(userId){
  const entries=state.timeEntries.filter(e=>e.userId===userId).sort((a,b)=>a.ts-b.ts);
  if(entries.length===0) return {status:'out', since:null, stale:false};
  const last=entries[entries.length-1];
  const stale = last.type==='in' && Date.now()-last.ts>MAX_SESSION_MS;
  return {status: (last.type==='in' && !stale) ? 'in' : 'out', since:last.ts, stale};
}

function computeSessions(userId){
  const entries=state.timeEntries.filter(e=>e.userId===userId).sort((a,b)=>a.ts-b.ts);
  const sessions=[];
  let openIn=null;
  const incomplete=e=>({inId:e.id, outId:null, inTs:e.ts, outTs:null, hours:null, stale:true});
  entries.forEach(e=>{
    if(e.type==='in'){
      if(openIn!==null) sessions.push(incomplete(openIn));   // vorige inklok zonder uitklok
      openIn=e;
    } else if(e.type==='out' && openIn!==null){
      if(e.ts-openIn.ts>MAX_SESSION_MS){ sessions.push(incomplete(openIn)); }  // onrealistisch lang: niet zomaar optellen
      else sessions.push({inId:openIn.id, outId:e.id, inTs:openIn.ts, outTs:e.ts, hours:(e.ts-openIn.ts)/3600000, stale:false});
      openIn=null;
    }
  });
  if(openIn!==null){ sessions.push({inId:openIn.id, outId:null, inTs:openIn.ts, outTs:null, hours:null, stale:Date.now()-openIn.ts>MAX_SESSION_MS}); }
  return sessions.reverse();
}

function staleSessions(){
  const out=[];
  state.users.filter(u=>!u.isKiosk).forEach(u=>{ computeSessions(u.id).forEach(x=>{ if(x.stale) out.push({user:u, session:x}); }); });
  return out.sort((a,b)=>a.session.inTs-b.session.inTs);
}

function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
}
function fmtHours(h){
  if(h===null||h===undefined) return '—';
  const hh=Math.floor(h);
  const mm=Math.round((h-hh)*60);
  return hh+'u'+String(mm).padStart(2,'0');
}

function parseHoursInput(str){
  str=String(str||'').trim().toLowerCase().replace(',','.');
  if(!str) return 0;
  const m=str.match(/^(\d+)\s*[u:h]\s*(\d{1,2})?$/);
  if(m) return parseInt(m[1],10)+(m[2]?parseInt(m[2],10)/60:0);
  const n=parseFloat(str); return isNaN(n)?NaN:n;
}
function hoursToInput(x){ return x? String(Math.round(x*100)/100).replace('.',','):''; }
const r4=x=>Math.round(x*10000)/10000;

async function setTotalPaid(uid_, newTotal){
  const {ledger}=computeWeeklyLedger();
  const ph=state.paidHours[uid_]=state.paidHours[uid_]||{};
  const cur=Object.values(ph).reduce((a,b)=>a+(+b||0),0);
  let delta=r4(newTotal-cur);
  const changed={};
  if(delta>0.00001){
    // eerst de oudste weken met openstaande uren aanvullen
    for(const w of ledger){
      if(delta<=0.00001) break;
      const v=w.rows[uid_]?w.rows[uid_].verschil:0;
      if(v>0.00001){ const add=Math.min(v,delta); ph[w.weekKey]=r4((ph[w.weekKey]||0)+add); changed[w.weekKey]=ph[w.weekKey]; delta=r4(delta-add); }
    }
    if(delta>0.00001){
      const last=ledger.length?ledger[ledger.length-1].weekKey:toDateKeyFromDate(startOfWeekMonday(new Date()));
      ph[last]=r4((ph[last]||0)+delta); changed[last]=ph[last];
    }
  } else if(delta<-0.00001){
    let rem=-delta;
    Object.keys(ph).sort().reverse().forEach(k=>{
      if(rem<=0.00001) return;
      const take=Math.min(ph[k]||0,rem);
      if(take>0){ ph[k]=r4((ph[k]||0)-take); changed[k]=ph[k]; rem=r4(rem-take); }
    });
  }
  await persistPaid(uid_, changed);
}

function sessionDayKey(s){ return toDateKeyFromDate(new Date(s.inTs)); }
function drawUrenInvoerInto(el){
  const curMon=startOfWeekMonday(new Date());
  if(!state.hoursWeekStart) state.hoursWeekStart=curMon;
  if(state.hoursWeekStart>curMon) state.hoursWeekStart=curMon;
  const start=state.hoursWeekStart;
  const days=[]; for(let i=0;i<7;i++) days.push(addDays(start,i));
  const todayKey=toDateKeyFromDate(new Date());
  const staff=state.users.filter(u=>!u.isKiosk);
  el.innerHTML=`
    <div class="week-nav" style="padding:0 16px 4px;">
      <button id="hwPrev">‹</button>
      <div class="wn-label">${fmtShortDate(start)} - ${fmtShortDate(days[6])}</div>
      <button id="hwNext" ${start>=curMon?'disabled':''}>›</button>
    </div>
    <p class="section-hint" style="margin:6px 16px 12px;">Tik op een dag bij een medewerker om uren toe te voegen, aan te passen of te verwijderen.</p>
    <div class="week-scroll" id="hwScroll"></div>
    <div class="legend" style="margin:14px 16px 20px;">
      <span><span class="sw-dash"></span>Ingepland, nog geen uren</span>
      <span><span class="sw" style="background:var(--green)"></span>Uren geregistreerd</span>
    </div>`;
  document.getElementById('hwPrev').onclick=()=>{ state.hoursWeekStart=addDays(start,-7); drawUrenInvoerInto(el); };
  document.getElementById('hwNext').onclick=()=>{ state.hoursWeekStart=addDays(start,7); drawUrenInvoerInto(el); };
  const sessByUser={};
  staff.forEach(u=>{ sessByUser[u.id]=computeSessions(u.id); });
  let html='<table class="grid-table"><thead><tr><th class="sticky-col">Medewerker</th>';
  days.forEach(d=>{ html+='<th>'+capFirst(DAGEN[(d.getDay()+6)%7])+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>'; });
  html+='<th>Week</th></tr></thead><tbody>';
  staff.forEach(u=>{
    html+='<tr><td class="sticky-col"><div class="gm-name">'+escapeHtml(u.name)+'</div></td>';
    let weekTotal=0;
    days.forEach(d=>{
      const key=toDateKeyFromDate(d);
      const future=key>todayKey;
      const ss=sessByUser[u.id].filter(s=>sessionDayKey(s)===key);
      const hrs=ss.reduce((a,s)=>a+(s.outTs?s.hours:0),0); weekTotal+=hrs;
      const open=ss.some(s=>!s.outTs && !s.stale);
      const isStale=ss.some(s=>s.stale);
      const planned=(state.schedule[key]||[]).some(a=>a.staffId===u.id);
      let cell='';
      if(isStale) cell='<div class="solid-chip" style="background:#b91c1c; color:#fff;">Uitklok mist</div>';
      else if(ss.length) cell='<div class="solid-chip">'+(hrs>0?fmtHours(hrs):'')+(open?(hrs>0?' + ':'')+'bezig':'')+'</div>';
      else if(planned) cell='<div class="dash-chip avail">Ingepland</div>';
      html+='<td class="grid-cell"'+(future?' style="opacity:.4; cursor:default;"':'')+' data-uid="'+u.id+'" data-date="'+key+'" data-future="'+(future?1:0)+'">'+cell+'</td>';
    });
    html+='<td style="font-weight:800; text-align:center;">'+(weekTotal>0?fmtHours(weekTotal):'')+'</td></tr>';
  });
  html+='</tbody></table>';
  const wrap=document.getElementById('hwScroll');
  wrap.innerHTML=html;
  wrap.querySelectorAll('.grid-cell').forEach(td=>{
    td.onclick=()=>{
      if(td.dataset.future==='1') return;
      openDayHoursModal(td.dataset.uid, td.dataset.date, ()=>drawUrenInvoerInto(el));
    };
  });
}

    sessions=computeSessions(userId).filter(s=>sessionDayKey(s)===key).sort((a,b)=>a.inTs-b.inTs);

        h+='<div class="entry-row" style="flex-direction:column; align-items:stretch; margin:0 0 8px;" data-i="'+i+'">'
          +'<div style="display:flex; gap:8px; align-items:center;"><input type="time" class="ds-in" value="'+hm(s.inTs)+'" style="'+inp+'"><span>–</span><input type="time" class="ds-out" value="'+(s.outTs?hm(s.outTs):'')+'" style="'+inp+'"></div>'

          +'<div class="wdr-empty" style="margin-top:6px;">'+(s.outTs?fmtHours(s.hours):(s.stale?'<b style="color:#b91c1c;">Uitklok ontbreekt: vul de eindtijd in en tik op Opslaan.</b>':'bezig (nog niet uitgeklokt)'))+'</div></div>';
      });
    } else h+='<div class="empty-state" style="padding:14px;">Nog geen uren voor deze dag.</div>';
    if(!sessions.length){
      h+='<div style="font-weight:700; margin:14px 0 8px;">Uren toevoegen</div>'
        +'<div style="display:flex; gap:8px; margin-bottom:8px;"><button type="button" class="btn-secondary ds-preset" data-s="13:00" data-e="16:00" style="margin:0; flex:1;">13:00 - 16:00</button><button type="button" class="btn-secondary ds-preset" data-s="09:00" data-e="12:00" style="margin:0; flex:1;">09:00 - 12:00</button></div>'
        +'<div style="display:flex; gap:8px; align-items:center;"><input type="time" id="dsNewIn" style="'+inp+'"><span>–</span><input type="time" id="dsNewOut" style="'+inp+'"></div>'
        +'<div class="err-msg" id="dsErr" style="display:none; margin-top:10px;"></div>'
        +'<div class="form-btn-row"><button class="btn-cancel" id="dsClose">Sluiten</button><button class="cta-green" id="dsAdd">Toevoegen</button></div></div>';
    } else {
      h+='<div class="err-msg" id="dsErr" style="display:none; margin-top:10px;"></div><p class="section-hint" style="margin:10px 0 0;">Per dag is er één registratie. Pas de uren hierboven aan, of verwijder ze om opnieuw in te geven.</p>'
        +'<div class="form-btn-row"><button class="btn-cancel" id="dsClose" style="flex:1; padding:12px;">Sluiten</button></div></div>';
    }
    overlay.innerHTML=h;
    const q=s=>overlay.querySelector(s);
    const err=msg=>{ const e=q('#dsErr'); e.textContent=msg; e.style.display='block'; };
    q('.modal-close').onclick=close; q('#dsClose').onclick=close;
    overlay.querySelectorAll('.ds-preset').forEach(b=>b.onclick=()=>{ q('#dsNewIn').value=b.dataset.s; q('#dsNewOut').value=b.dataset.e; });
    overlay.querySelectorAll('[data-i]').forEach(row=>{
      const s=sessions[+row.dataset.i];
      row.querySelector('.ds-save').onclick=async ()=>{
        const a=row.querySelector('.ds-in').value, b=row.querySelector('.ds-out').value;
        if(!a||!b) return err('Vul van- en tot-tijd in.');
        const i=new Date(key+'T'+a).getTime(), o=new Date(key+'T'+b).getTime();
        if(!(o>i)) return err('De eindtijd moet na de starttijd liggen.');
        if(overlaps(i,o,s)) return err('Deze uren overlappen met een andere registratie van die dag.');
        await saveSessionEdit(userId, s, i, o); close();
      };
      row.querySelector('.ds-del').onclick=async ()=>{
        if(!await askConfirm('Deze gewerkte sessie verwijderen?')) return;
        await deleteSession(s); render();
      };
    });
    if(q('#dsAdd')) q('#dsAdd').onclick=async ()=>{
      const a=q('#dsNewIn').value, b=q('#dsNewOut').value;
      if(!a||!b) return err('Vul van- en tot-tijd in.');

      if(!(o>i)) return err('De eindtijd moet na de starttijd liggen.');
      if(overlaps(i,o,null)) return err('Deze uren overlappen met een andere registratie van die dag.');
      const msg=await persistManualSession(userId,i,o);
      if(msg) return err(msg);
      close();
    };
  };
  render();
}

/* ---- QR scanner (camera) ---- */
async function openScanner(){
  const root=document.getElementById('modalRoot');
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal-card scanner-card">
      <div class="modal-head"><div class="modal-date">QR-code scannen</div><button class="modal-close">×</button></div>
      <video id="scanVideo" playsinline autoplay muted></video>
      <canvas id="scanCanvas" style="display:none;"></canvas>
      <div id="scanMsg" class="section-hint" style="margin:10px 16px 0;">Richt de camera op de QR-code bij de ingang.</div>
    </div>
  `;
  let stream=null;
  let stopped=false;
  function closeScanner(){
    stopped=true;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    root.innerHTML='';
  }
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeScanner(); });
  overlay.querySelector('.modal-close').onclick=closeScanner;
  root.innerHTML='';
  root.appendChild(overlay);

  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
  }catch(err){
    document.getElementById('scanMsg').textContent='Kan de camera niet openen ('+err.message+'). Geef camera-toegang in je browserinstellingen en probeer opnieuw.';
    return;
  }
  const video=document.getElementById('scanVideo');
  video.srcObject=stream;
  const canvas=document.getElementById('scanCanvas');
  const ctx=canvas.getContext('2d');

  async function tick(){
    if(stopped) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(imgData.data, imgData.width, imgData.height);
      if(code){
        const ok=await handleScanResult(code.data);
        if(ok){ closeScanner(); return; }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function handleScanResult(data){
  const msgEl=document.getElementById('scanMsg');
  // Validatie gebeurt nu volledig server-side (verify-clock edge function):
  // het kiosk-geheim staat nergens op dit toestel, dus enkel een echte,
  // actuele scan van het kiosk-scherm kan hier ooit voor slagen.
  const result=await callEdgeFunction('verify-clock', { scanned: data||'' });
  if(!result.success){
    if(msgEl) msgEl.textContent=result.error||'Ongeldige QR-code.';
    return false;
  }
  await loadAll();   // haal de echte registratie (met echte id) op, zodat bewerken/verwijderen later klopt
  renderWerkuren();
  return true;
}

// Berekent een voorstel. Wijzigt NIETS in de opgeslagen planning; geeft enkel een lijst terug.
function computeAutoPlan(year, month){
  const p=getPlanPrefs();
  const todayKey=toDateKeyFromDate(new Date());
  const staff=planStaff();
  const weightOf=u=>{ const l=p.levels[u.id]||'C'; return l==='A'?p.weightA:(l==='B'?p.weightB:0); };
  const days=[];
  const last=new Date(year, month+1, 0).getDate();
  for(let d=1; d<=last; d++){
    const dt=new Date(year, month, d);
    const wd=(dt.getDay()+6)%7;
    const key=toDateKeyFromDate(dt);
    if(key<todayKey) continue;
    if(!p.planDays.includes(wd)) continue;
    days.push({key, wd});
  }
  // aantal reeds (bevestigd of klaargezet) ingeplande dagen in deze maand
  const monthCount={}; staff.forEach(u=>monthCount[u.id]=0);
  const isAssigned=(key,uid)=>{
    const pk=key+'|'+uid;
    if(state.pendingScheduleChanges.hasOwnProperty(pk)) return !!state.pendingScheduleChanges[pk];
    return (state.schedule[key]||[]).some(a=>a.staffId===uid);
  };
  const monthPrefix=year+'-'+String(month+1).padStart(2,'0');
  const allKeys=new Set(Object.keys(state.schedule));
  Object.keys(state.pendingScheduleChanges).forEach(k=>allKeys.add(k.slice(0,k.lastIndexOf('|'))));
  allKeys.forEach(key=>{ if(key.startsWith(monthPrefix)) staff.forEach(u=>{ if(isAssigned(key,u.id)) monthCount[u.id]++; }); });
  const availCount={};
  staff.forEach(u=>{ availCount[u.id]=Object.keys(state.availability[u.id]||{}).filter(k=>k.startsWith(monthPrefix)&&k>=todayKey&&state.availability[u.id][k]==='available').length; });

  const added=[]; // {key, uid, fixed}
  const slots={};
  days.forEach(day=>{
    slots[day.key]=staff.filter(u=>isAssigned(day.key,u.id)).length;
  });
  // 1) vaste dagen
  days.forEach(day=>{
    staff.forEach(u=>{
      if((p.fixed[u.id]||[]).includes(day.wd) && !isAssigned(day.key,u.id)){
        added.push({key:day.key, uid:u.id, fixed:true});
        state.pendingScheduleChanges[day.key+'|'+u.id]=true; // tijdelijk, voor tellingen (wordt zo meteen gemarkeerd)
        monthCount[u.id]++; slots[day.key]++;
      }
    });
  });
  // 2) eerlijk aanvullen: dagen met de minste kandidaten eerst
  const candidatesFor=day=>staff.filter(u=>weightOf(u)>0 && (state.availability[u.id]||{})[day.key]==='available' && !isAssigned(day.key,u.id));
  const order=days.slice().sort((a,b)=>candidatesFor(a).length-candidatesFor(b).length || (a.key<b.key?-1:1));
  order.forEach(day=>{
    while(slots[day.key]<p.perDay){
      const c=candidatesFor(day);
      if(!c.length) break;
      c.sort((a,b)=>{
        const ra=monthCount[a.id]/(weightOf(a)*Math.max(1,availCount[a.id]));
        const rb=monthCount[b.id]/(weightOf(b)*Math.max(1,availCount[b.id]));
        return ra-rb || a.name.localeCompare(b.name);
      });
      const pick=c[0];
      added.push({key:day.key, uid:pick.id, fixed:false});
      state.pendingScheduleChanges[day.key+'|'+pick.id]=true;
      monthCount[pick.id]++; slots[day.key]++;
    }
  });
  const unfilled=days.filter(d=>slots[d.key]<p.perDay).map(d=>d.key);
  // tijdelijke markeringen weer weg; de aanroeper zet het resultaat definitief klaar
  added.forEach(a=>{ delete state.pendingScheduleChanges[a.key+'|'+a.uid]; });
  return {added, unfilled, monthCount, days};
}

function openAutoPlanDialog(){
  const base=new Date(state.adminGridWeekStart); base.setDate(base.getDate()+3);
  let y=base.getFullYear(), m=base.getMonth();
  const MAANDEN=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px;';
  ov.innerHTML='<div class="card" style="background:#fff; max-width:420px; width:100%; max-height:90vh; overflow:auto; padding:18px; border-radius:16px;"><h2 class="section-title" style="margin:0 0 8px;">Automatisch plannen</h2><p class="section-hint" style="margin:0 0 12px;">Maak een eerlijke verdeling voor de gekozen maand op basis van opgegeven beschikbaarheid en je planningsvoorkeuren. Je kan het resultaat daarna nog aanpassen vooraleer je bevestigt.</p><div class="week-nav" style="padding:0 0 10px;"><button id="apPrev">‹</button><div class="wn-label" id="apLabel"></div><button id="apNext">›</button></div><div id="apResult" style="font-size:14px; margin-bottom:12px;"></div><button class="cta-green" id="apRun" style="width:100%;">Verdeling maken</button><button class="btn-secondary" id="apClose" style="width:100%; margin-top:8px;">Annuleren</button></div>';
  document.body.appendChild(ov);
  const lab=()=>{ ov.querySelector('#apLabel').textContent=MAANDEN[m]+' '+y; ov.querySelector('#apResult').innerHTML=''; };
  lab();
  ov.querySelector('#apPrev').onclick=()=>{ m--; if(m<0){m=11;y--;} lab(); };
  ov.querySelector('#apNext').onclick=()=>{ m++; if(m>11){m=0;y++;} lab(); };
  ov.querySelector('#apClose').onclick=()=>ov.remove();

    const res=computeAutoPlan(y,m);
    res.added.forEach(a=>{ state.pendingScheduleChanges[a.key+'|'+a.uid]=true; });

    let msg='<b>'+res.added.length+' inplanning'+(res.added.length===1?'':'en')+' klaargezet</b> (oranje). Ze zijn nog niet opgeslagen: bevestig onderaan met "Bevestig inplanning".';
    if(res.added.length){ msg+='<ul style="margin:8px 0 0 18px; padding:0;">'+Object.entries(per).map(([n,c])=>'<li>'+escapeHtml(n)+': '+c+' dag'+(c===1?'':'en')+'</li>').join('')+'</ul>'; }
    else msg='Er was niets bij te plannen voor deze maand (geen beschikbaarheid, of alles is al ingevuld).';
    if(res.unfilled.length) msg+='<p style="color:#b45309; margin:8px 0 0;">Niet genoeg beschikbare personen op: '+res.unfilled.map(k=>k.slice(8)+'/'+k.slice(5,7)).join(', ')+'.</p>';
    ov.querySelector('#apResult').innerHTML=msg;
    ov.querySelector('#apRun').textContent='Opnieuw berekenen';
    ov.querySelector('#apClose').textContent='Sluiten';
  };

function buildContractGroups(){
  const start=state.contractWeekStart;
  const days=[]; for(let i=0;i<7;i++) days.push(addDays(start,i));
  const groups=[];
  days.forEach(d=>{
    const dow=d.getDay();
    const rule=CONTRACT_RULES[dow];
    if(!rule) return;
    const key=toDateKeyFromDate(d);
    const entries=(state.schedule[key]||[])
      .map(a=>state.users.find(u=>u.id===a.staffId))
      .filter(u=>u && !u.isKiosk);
    if(entries.length===0) return;
    groups.push({
      date:d, dateKey:key, rule,
      label: capFirst(WEEKDAG_LANG[dow])+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),
      names: entries.map(u=>u.name.split(' ')[0])
    });
  });
  return groups;
}

  const start=state.contractWeekStart;
  document.getElementById('cWeekLabel').textContent = fmtShortDate(start)+' - '+fmtShortDate(addDays(start,6));

function generateLiantisMail(){
  const start=state.contractWeekStart;
  const days=[]; for(let i=0;i<7;i++) days.push(addDays(start,i));

  const dayMap={};
  days.forEach(d=>{
    const dow=d.getDay();
    const rule=CONTRACT_RULES[dow];
    if(!rule) return;
    const key=toDateKeyFromDate(d);
    const names=(state.schedule[key]||[])
      .map(a=>state.users.find(u=>u.id===a.staffId))
      .filter(u=>u && !u.isKiosk)
      .map(u=>u.name.split(' ')[0]);
    dayMap[key]={
      date:d, dow, rule,
      label: capFirst(WEEKDAG_LANG[dow])+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),
      names
    };
  });

  const weekendKeys=days.filter(d=>d.getDay()===6||d.getDay()===0).map(toDateKeyFromDate);
  const errors=[];
  const selectedOutstanding=Array.from(document.querySelectorAll('.outstanding-check:checked')).map(chk=>{
    return state.users.find(x=>x.id===chk.getAttribute('data-user'));
  }).filter(Boolean);

  selectedOutstanding.forEach(u=>{
    const firstName=u.name.split(' ')[0];
    let placed=false;
    for(const wk of weekendKeys){
      const already=(state.schedule[wk]||[]).some(a=>a.staffId===u.id);
      if(!already && dayMap[wk]){
        dayMap[wk].names.push(firstName);
        placed=true;
        break;
      }
    }
    if(!placed){
      errors.push('Het is niet mogelijk om de openstaande uren van '+u.name+' uit te betalen deze week \u2014 '+u.name.split(' ')[0]+' staat al ingepland op zowel zaterdag als zondag.');
    }
  });

  let body='Beste,\n\nGelieve volgende contracten op te maken voor '+brandLegal()+'.\n\n';
  days.forEach(d=>{
    const key=toDateKeyFromDate(d);
    const group=dayMap[key];
    if(!group || group.names.length===0) return;
    body+=group.label+'\n';
    group.names.forEach(n=>{ body+=group.rule.start+' - '+group.rule.end+' '+n+'\n'; });
    body+='\n';
  });
  body+='Met vriendelijke groeten,\n'+brandName();
  document.getElementById('mailPreview').value=body;

  const errEl=document.getElementById('mailGenErr');
  if(errors.length>0){
    errEl.innerHTML=errors.map(e=>escapeHtml(e)).join('<br>');
    errEl.style.display='block';
  } else {
    errEl.style.display='none';
  }

  const subject='Contracten week '+fmtShortDate(start)+' - '+fmtShortDate(addDays(start,6))+' - '+brandName();
  const to=(state.liantisEmail||'').trim();
  const mailto='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  const wrap=document.getElementById('mailLinkWrap');
  wrap.innerHTML='<a href="'+mailto+'" class="btn-secondary" style="display:block; text-align:center; text-decoration:none;">Open e-mail in mailprogramma</a>';
}

async function persistManualSession(userId,inTs,outTs){
  const { error } = await sb.from('time_entries').insert([
    { user_id:userId, type:'in', ts:new Date(inTs).toISOString(), manual:true },
    { user_id:userId, type:'out', ts:new Date(outTs).toISOString(), manual:true },
  ]);
  if(error) return error.message;
  await loadAll();
  return null;
}

async function saveSessionEdit(userId, session, newInTs, newOutTs){
  if(session.inId){
    await sb.from('time_entries').update({ ts:new Date(newInTs).toISOString() }).eq('id', session.inId);
  }
  if(session.outId){
    await sb.from('time_entries').update({ ts:new Date(newOutTs).toISOString() }).eq('id', session.outId);
  } else {
    await sb.from('time_entries').insert({ user_id:userId, type:'out', ts:new Date(newOutTs).toISOString(), manual:true });
  }
  await loadAll();
}

async function deleteSession(session){
  if(session.inId) await sb.from('time_entries').delete().eq('id', session.inId);
  if(session.outId) await sb.from('time_entries').delete().eq('id', session.outId);
  await loadAll();
}

function drawSessionsManageList(){
  const el=document.getElementById('sessionsManageList');
  if(!el) return;
  const monthKey=state.ledgerMonthKey;
  const staffUsers=state.users.filter(u=>!u.isKiosk);
  const rows=[];
  staffUsers.forEach(u=>{
    computeSessions(u.id).forEach(s=>{
      const d=new Date(s.inTs);
      const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(monthKey && mk!==monthKey) return;
      rows.push({user:u, session:s});

  rows.sort((a,b)=>b.session.inTs-a.session.inTs);
  if(rows.length===0){

  el.innerHTML='';
  rows.forEach(({user,session})=>{

    editBtn.onclick=()=>{

      const startVal=String(inD.getHours()).padStart(2,'0')+':'+String(inD.getMinutes()).padStart(2,'0');
      const endVal=outD ? String(outD.getHours()).padStart(2,'0')+':'+String(outD.getMinutes()).padStart(2,'0') : '';

        </div>
        <div class="err-msg se-err" style="display:none;"></div>

          <button class="btn-cancel se-cancel">Annuleer</button>

function computeWeeklyLedger(){
  const staffUsers=state.users.filter(u=>!u.isKiosk);
  const weekRawTotals={};
  staffUsers.forEach(u=>{
    computeSessions(u.id).forEach(s=>{
      if(!s.outTs) return;
      const wkStart=startOfWeekMonday(new Date(s.inTs));
      const wk=toDateKeyFromDate(wkStart);
      if(!weekRawTotals[wk]) weekRawTotals[wk]={};
      weekRawTotals[wk][u.id]=(weekRawTotals[wk][u.id]||0)+s.hours;
    });
  });
  // Alle weken aaneensluitend tonen (ook weken zonder sessies) zodat de admin overal uren kan ingeven
  const keySet=new Set(Object.keys(weekRawTotals));
  Object.values(state.paidHours||{}).forEach(o=>Object.keys(o||{}).forEach(k=>keySet.add(k)));
  keySet.add(toDateKeyFromDate(startOfWeekMonday(new Date())));
  const sortedKeys=[...keySet].sort();
  const weekKeys=[];
  { let cur=new Date(sortedKeys[0]+'T00:00:00'); const endD=new Date(sortedKeys[sortedKeys.length-1]+'T00:00:00');
    while(cur<=endD){ weekKeys.push(toDateKeyFromDate(cur)); cur=addDays(cur,7); } }
  const eindsaldo={};
  staffUsers.forEach(u=>{ eindsaldo[u.id]=0; });
  const ledger=[];
  weekKeys.forEach(wk=>{
    const rowData={};
    staffUsers.forEach(u=>{
      const gewerkt=(weekRawTotals[wk]||{})[u.id]||0;
      const doorgegeven=(state.paidHours[u.id] && state.paidHours[u.id][wk]) || 0;
      const verschil=gewerkt-doorgegeven;
      rowData[u.id]={gewerkt, doorgegeven, verschil};
      eindsaldo[u.id]+=verschil;
    });
    const [y,m,d]=wk.split('-').map(Number);
    const start=new Date(y,m-1,d);
    const end=addDays(start,6);
    ledger.push({weekKey:wk, label: fmtShortDate(start)+' - '+fmtShortDate(end), rows:rowData});
  });
  return {staffUsers, ledger, eindsaldo};
}

function drawLedgerTable(){
  const {staffUsers, ledger, eindsaldo}=computeWeeklyLedger();
  const wrap=document.getElementById('ledgerScroll');
  const navEl=document.getElementById('ledgerMonthNav');
  drawLedgerSummary(staffUsers, eindsaldo);
  if(ledger.length===0 || staffUsers.length===0){
    navEl.innerHTML='';
    wrap.innerHTML='<div class="empty-state">Nog geen volledige gewerkte weken.</div>';
    drawSessionsManageList();
    return;
  }
  const monthKeys=[...new Set(ledger.map(w=>w.weekKey.slice(0,7)))].sort();
  if(!state.ledgerMonthKey || !monthKeys.includes(state.ledgerMonthKey)){
    state.ledgerMonthKey=monthKeys[monthKeys.length-1];
  }
  const idx=monthKeys.indexOf(state.ledgerMonthKey);
  const [my,mm]=state.ledgerMonthKey.split('-').map(Number);
  navEl.innerHTML=`
    <button id="ledgerPrevMonth" ${idx<=0?'disabled':''}>‹</button>
    <div class="label">${MAANDEN[mm-1]} ${my}</div>
    <button id="ledgerNextMonth" ${idx>=monthKeys.length-1?'disabled':''}>›</button>
  `;
  document.getElementById('ledgerPrevMonth').onclick=()=>{ state.ledgerMonthKey=monthKeys[idx-1]; drawLedgerTable(); };
  document.getElementById('ledgerNextMonth').onclick=()=>{ state.ledgerMonthKey=monthKeys[idx+1]; drawLedgerTable(); };

  const weeksThisMonth=ledger.filter(w=>w.weekKey.slice(0,7)===state.ledgerMonthKey).slice().reverse();
  let html='<table class="grid-table"><thead><tr><th class="sticky-col" rowspan="2">Medewerker</th>';
  weeksThisMonth.forEach(week=>{ html+='<th colspan="3">'+week.label+'</th>'; });
  html+='</tr><tr>';
  weeksThisMonth.forEach(()=>{ html+='<th>Gewerkt</th><th>Doorgeg.</th><th>Verschil</th>'; });
  html+='</tr></thead><tbody>';
  staffUsers.forEach(u=>{
    html+='<tr><td class="sticky-col"><div class="gm-name">'+escapeHtml(u.name)+'</div></td>';
    weeksThisMonth.forEach(week=>{
      const r=week.rows[u.id];
      html+='<td>'+fmtHours(r.gewerkt)+'</td>'
        +'<td><input type="number" step="0.25" min="0" class="ledger-input" data-week="'+week.weekKey+'" data-user="'+u.id+'" value="'+(r.doorgegeven||'')+'" placeholder="0"></td>'
        +'<td class="'+(r.verschil>0.001?'ledger-owe':'')+'">'+fmtHours(r.verschil)+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.ledger-input').forEach(inp=>{
    inp.onchange=async ()=>{
      const wk=inp.getAttribute('data-week');
      const uid_=inp.getAttribute('data-user');
      const val=parseFloat(inp.value)||0;
      if(!state.paidHours[uid_]) state.paidHours[uid_]={};
      state.paidHours[uid_][wk]=val;
      await sb.from('paid_hours').upsert({ user_id:uid_, week_start:wk, hours:val });
      drawLedgerTable();
    };
  });
  drawSessionsManageList();
}

function groupLedgerByMonth(ledger){
  const monthGroups=[];
  let curKey=null, curGroup=null;
  ledger.forEach(week=>{
    const mk=week.weekKey.slice(0,7);
    if(mk!==curKey){
      curKey=mk;
      const [y,m]=mk.split('-').map(Number);
      curGroup={ monthLabel: capFirst(MAANDEN[m-1])+' '+y, weeks:[] };
      monthGroups.push(curGroup);
    }
    curGroup.weeks.push(week);
  });
  return monthGroups;
}

  staffUsers.forEach(u=>{

function exportUrenExcel(){
  if(!state.currentUser.isAdmin) return;
  const {staffUsers, ledger, eindsaldo}=computeWeeklyLedger();
  if(ledger.length===0 || staffUsers.length===0){
    const ws=XLSX.utils.aoa_to_sheet([['Nog geen volledige gewerkte weken.']]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Werkuren');
    XLSX.writeFile(wb, 'werkuren-'+brandSlugFile()+'.xlsx');
    return;
  }

  const monthGroups=groupLedgerByMonth(ledger);

  const totalWeekCols=ledger.length*2;
  const lastCol=1+totalWeekCols; // kolom 0 = Medewerker, laatste kolom = Eindsaldo

  const row0=new Array(lastCol+1).fill('');
  const row1=new Array(lastCol+1).fill('');
  const row2=new Array(lastCol+1).fill('');
  row0[0]='Medewerker';
  row0[lastCol]='Eindsaldo nog te betalen';

  const merges=[
    { s:{r:0,c:0}, e:{r:2,c:0} },
    { s:{r:0,c:lastCol}, e:{r:2,c:lastCol} },
  ];

  let col=1;
  monthGroups.forEach(g=>{
    const monthStart=col;
    g.weeks.forEach(week=>{
      row1[col]=week.label.split(' - ')[0];
      row2[col]='Nog te betalen uren';
      row2[col+1]='Tot. ingeschreven uren';
      merges.push({ s:{r:1,c:col}, e:{r:1,c:col+1} });
      col+=2;
    });
    row0[monthStart]=g.monthLabel;
    if(col-1>monthStart) merges.push({ s:{r:0,c:monthStart}, e:{r:0,c:col-1} });
  });

  const rows=[row0, row1, row2];
  staffUsers.forEach(u=>{
    const row=new Array(lastCol+1).fill('');
    row[0]=u.name;
    let c=1;
    ledger.forEach(week=>{
      const r=week.rows[u.id];
      row[c]=Math.round(r.verschil*100)/100;
      row[c+1]=Math.round(r.gewerkt*100)/100;
      c+=2;
    });
    row[lastCol]=Math.round((eindsaldo[u.id]||0)*100)/100;
    rows.push(row);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!merges']=merges;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Werkuren');
  XLSX.writeFile(wb, 'werkuren-'+brandSlugFile()+'.xlsx');
}

const TAB_TITLES={home:'Home', werktijden:'Werktijden', beschikbaarheid:'Beschikbaarheid', werkuren:'Werkuren', meer:'Meer'};

/* ===== Data verversen (nieuwe gegevens van anderen zien zonder opnieuw in te loggen) ===== */
let _lastRefresh=Date.now(), _refreshing=false;
function dataSig(){ try{ return JSON.stringify([state.users.length,state.availability,state.schedule,state.messages,state.timeEntries,state.paidHours]); }catch(e){ return ''; } }
async function refreshData(force){
  if(_refreshing || !state.currentUser || state.currentUser.isKiosk) return;
  if(!force && Date.now()-_lastRefresh<15000) return;
  _refreshing=true;
  try{
    const keep=state.currentUser, imp=state.impersonatingFrom, before=dataSig();
    // Klant geblokkeerd of uitzicht (naam/logo/kleuren) gewijzigd door Shift? Meteen toepassen.
    let brandChanged=false;
    try{
      const { data: b } = await sb.rpc('get_my_branding');
      if(b){
        if(!b.active){ applyBranding(b); _lastRefresh=Date.now(); renderBlocked(); return; }
        if(JSON.stringify(b)!==JSON.stringify(Object.assign({},b,state.tenant?Object.fromEntries(Object.keys(b).map(k=>[k,state.tenant[k]])):{}))){ applyBranding(b); brandChanged=true; }
      }
    }catch(e){}
    const seq0=window._writeSeq||0;
    await loadAll();
    if((window._writeSeq||0)!==seq0){ await new Promise(r=>setTimeout(r,300)); await loadAll(); }
    state.impersonatingFrom=imp;
    state.currentUser=state.users.find(u=>u.id===keep.id)||keep;
    _lastRefresh=Date.now();
    const busy=document.querySelector('#modalRoot .modal-overlay') || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    const inApp=state.activeTab && state.currentUser && state.currentUser.id===keep.id && document.getElementById('tab-'+state.activeTab);
    if(brandChanged && !busy && inApp) renderApp();
    else if(dataSig()!==before && !busy && inApp) setTab(state.activeTab);
  }catch(e){ console.warn('refresh mislukt',e); }
  finally{ _refreshing=false; }
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshData(); });

function setTab(tab){
  state.activeTab=tab;
  document.getElementById('pageTitle').textContent=TAB_TITLES[tab];
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='home') renderHome();
  if(tab==='werktijden') renderWerktijden();

function renderDateStrip(el, days, selectedKey, onSelect){
  el.innerHTML='';
  days.forEach(d=>{

    const hasShift=(state.schedule[k]||[]).some(a=>a.staffId===state.currentUser.id);
    const btn=document.createElement('button');
    btn.className='date-pill'+(k===selectedKey?' selected':'')+(hasShift?' has-shift':'');
    btn.innerHTML='<span class="dnum">'+d.getDate()+'/'+(d.getMonth()+1)+'</span><span class="dday">'+capFirst(DAGEN[(d.getDay()+6)%7])+'</span>';
    btn.onclick=()=>onSelect(k);

function colleaguesOn(dateKey_){
  const uid_=state.currentUser.id;
  return (state.schedule[dateKey_]||[])
    .filter(a=>a.staffId!==uid_)
    .map(a=>{ const u=state.users.find(x=>x.id===a.staffId); return u ? u.name : null; })
    .filter(Boolean);
}

function renderShiftPanel(el, dateKey_, emptyText){
  const entries=(state.schedule[dateKey_]||[]).filter(a=>a.staffId===state.currentUser.id);
  if(entries.length===0){
    el.innerHTML='<div class="shift-panel">'+calendarXIcon+'<span>'+emptyText+'</span></div>';
  } else {
    const colleagues=colleaguesOn(dateKey_);
    const colleagueLine = colleagues.length>0
      ? 'Samen met: '+colleagues.map(escapeHtml).join(', ')
      : 'Je werkt deze dag alleen.';
    el.innerHTML='<div class="shift-list"><div class="shift-chip"><span>Ingepland</span><span>'+formatDateLong(dateKey_)+'</span></div><div class="colleague-note">'+colleagueLine+'</div></div>';
  }
}

function drawAdminGridTable(){
  const start=state.adminGridWeekStart;
  const days=[]; for(let i=0;i<7;i++) days.push(addDays(start,i));
  document.getElementById('gWeekLabel').textContent = fmtShortDate(start)+' - '+fmtShortDate(days[6]);

  const wrap=document.getElementById('gridScroll');
  let html='<table class="grid-table"><thead><tr><th class="sticky-col">Medewerker</th>';
  days.forEach(d=>{
    const wd=capFirst(DAGEN[(d.getDay()+6)%7]);
    html+='<th>'+wd+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>';
  });
  html+='</tr></thead><tbody>';
  state.users.filter(u=>!u.isKiosk).forEach(u=>{
    html+='<tr><td class="sticky-col"><div class="gm-name">'+escapeHtml(u.name)+'</div><div class="gm-role">'+(u.isAdmin?'Administrator':'Medewerker')+'</div></td>';
    days.forEach(d=>{
      const key=toDateKeyFromDate(d);
      const pKey=key+'|'+u.id;
      const status=(state.availability[u.id]||{})[key];
      const savedAssigned=(state.schedule[key]||[]).some(a=>a.staffId===u.id);
      const hasPending=state.pendingScheduleChanges.hasOwnProperty(pKey);
      const effectiveAssigned=hasPending ? state.pendingScheduleChanges[pKey] : savedAssigned;
      let cellHtml='';
      if(status==='available') cellHtml+='<div class="dash-chip avail">Beschikbaar</div>';
      if(effectiveAssigned) cellHtml+='<div class="solid-chip'+(hasPending?' pending-chip':'')+'">Ingepland</div>';
      html+='<td class="grid-cell'+(hasPending?' pending-change':'')+'" data-uid="'+u.id+'" data-date="'+key+'">'+cellHtml+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;

  wrap.querySelectorAll('.grid-cell').forEach(td=>{
    td.onclick=()=>{
      const uid_=td.getAttribute('data-uid');
      const key=td.getAttribute('data-date');
      const pKey=key+'|'+uid_;
      const savedAssigned=(state.schedule[key]||[]).some(a=>a.staffId===uid_);
      const hasPending=state.pendingScheduleChanges.hasOwnProperty(pKey);
      const effective=hasPending ? state.pendingScheduleChanges[pKey] : savedAssigned;
      state.pendingScheduleChanges[pKey]=!effective;
      drawAdminGridTable();
    };
  });
  updateConfirmScheduleBtn();
}

function updateConfirmScheduleBtn(){
  const btn=document.getElementById('confirmScheduleBtn');
  if(!btn) return;
  const count=Object.keys(state.pendingScheduleChanges).length;
  btn.disabled = count===0;
  btn.textContent = count>0 ? 'Bevestig inplanning ('+count+')' : 'Bevestig inplanning';
}

async function confirmScheduleChanges(){
  const toInsert=[]; const toDelete=[];
  Object.entries(state.pendingScheduleChanges).forEach(([pKey,val])=>{
    const sep=pKey.lastIndexOf('|');
    const key=pKey.slice(0,sep);
    const uid_=pKey.slice(sep+1);
    if(!state.schedule[key]) state.schedule[key]=[];
    const already=state.schedule[key].some(a=>a.staffId===uid_);
    if(val && !already){ state.schedule[key].push({staffId:uid_}); toInsert.push({date:key, user_id:uid_}); }
    if(!val && already){ state.schedule[key]=state.schedule[key].filter(a=>a.staffId!==uid_); toDelete.push({date:key, user_id:uid_}); }
  });
  state.pendingScheduleChanges={};
  if(toInsert.length>0) await sb.from('schedule').upsert(toInsert);
  for(const d of toDelete){ await sb.from('schedule').delete().eq('date', d.date).eq('user_id', d.user_id); }
  drawAdminGridTable();
}
