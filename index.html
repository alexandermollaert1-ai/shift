function drawBeschikbaarheidCalendar(){
  const y=state.calYear, m=state.calMonth;
  document.getElementById('bMonthLabel').textContent=MAANDEN[m]+' '+y;
  const grid=document.getElementById('bCalGrid');
  grid.innerHTML='';
  const first=new Date(y,m,1);
  let startDow=first.getDay(); startDow = startDow===0?6:startDow-1;
  const daysInMonth=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++){ const e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
  const uid_=state.currentUser.id;
  const savedAvail=state.availability[uid_] || {};
  const todayKey=toDateKeyFromDate(new Date());
  for(let d=1; d<=daysInMonth; d++){
    const key=dateKey(y,m,d);
    const isPast=key<todayKey;
    const hasPending=state.pendingAvail.hasOwnProperty(key);
    const pending=hasPending ? state.pendingAvail[key] : undefined;
    const effective = hasPending ? pending : (savedAvail[key]||null);
    const cell=document.createElement('div');
    let cls='cal-day';
    if(hasPending){
      if(effective==='available') cls+=' pending-avail';
    } else {
      if(effective==='available') cls+=' available';
    }
    if(isPast) cls+=' cal-day-disabled';
    cell.className=cls;
    cell.innerHTML='<span>'+d+'</span>';
    const assigned=(state.schedule[key]||[]).some(a=>a.staffId===uid_);
    if(assigned){ const dot=document.createElement('div'); dot.className='shift-dot'; cell.appendChild(dot); }
    if(!isPast){
      cell.onclick=()=>{
        const next = effective==='available' ? null : 'available';
        state.pendingAvail[key]=next;
        drawBeschikbaarheidCalendar();
      };
    }
    grid.appendChild(cell);
  }
  const btn=document.getElementById('submitAvailBtn');
  const pendingCount=Object.keys(state.pendingAvail).length;
  btn.disabled = pendingCount===0;
  btn.textContent = pendingCount>0 ? 'Bevestig beschikbaarheid ('+pendingCount+')' : 'Bevestig beschikbaarheid';
}

async function submitAvailability(){
  const uid_=state.currentUser.id;
  if(!state.availability[uid_]) state.availability[uid_]={};
  const toInsert=[]; const toDeleteDates=[];
  Object.entries(state.pendingAvail).forEach(([key,val])=>{
    if(val===null){ delete state.availability[uid_][key]; toDeleteDates.push(key); }
    else { state.availability[uid_][key]=val; toInsert.push({user_id:uid_, date:key, status:'available'}); }
  });
  state.pendingAvail={};
  if(toInsert.length>0) await sb.from('availability').upsert(toInsert);
  if(toDeleteDates.length>0) await sb.from('availability').delete().eq('user_id', uid_).in('date', toDeleteDates);
  drawBeschikbaarheidCalendar();
}

      <label class="field-label">E-mailadres</label>

      <label class="field-label">Tijdelijk wachtwoord</label>
      <div class="field-row">
        <div><input type="text" id="nuPw" placeholder="Tijdelijk wachtwoord"></div>
        <button class="btn-ghost-sm" id="nuGen">Genereer</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="nuAdmin" style="width:16px;height:16px;">
        <label for="nuAdmin">Deze gebruiker is ook administrator</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="nuKiosk" style="width:16px;height:16px;">
        <label for="nuKiosk">Dit is een kiosk-scherm (toont enkel een QR-code om in/uit te klokken)</label>
      </div>
      <div class="err-msg" id="nuErr" style="display:none;"></div>
      <div class="info-msg" id="nuOk" style="display:none;"></div>
      <button class="btn-primary" id="nuBtn">Gebruiker aanmaken</button>
    </div>
    <h2 class="section-title" style="margin:0 16px 10px;">Medewerkers</h2>
    <div class="card" id="userList" style="margin:0 16px 16px;"></div>
  `;
  document.getElementById('nuGen').onclick=()=>{ document.getElementById('nuPw').value=genTempPassword(); };
  document.getElementById('nuAdmin').onchange=(e)=>{ if(e.target.checked) document.getElementById('nuKiosk').checked=false; };
  document.getElementById('nuKiosk').onchange=(e)=>{ if(e.target.checked) document.getElementById('nuAdmin').checked=false; };
  document.getElementById('nuBtn').onclick=createUser;
  drawUserList();
}

function drawBerichtenInto(body){
  const canPost=state.currentUser.isAdmin;
  body.innerHTML=`
    ${canPost ? `
    <div class="msg-compose" style="margin:0 16px 18px;">
      <textarea id="msgInput" placeholder="Schrijf een bericht…"></textarea>
      <button id="msgSend">Plaats</button>
    </div>` : `
    <p class="section-hint" style="margin:0 16px 14px;">Enkel administrators kunnen berichten plaatsen.</p>`}
    <div id="msgList" style="margin:0 16px;"></div>
  `;
  if(canPost){
    document.getElementById('msgSend').onclick=async ()=>{
      const ta=document.getElementById('msgInput');
      const text=ta.value.trim();
      if(!text) return;
      const { data, error } = await sb.from('messages').insert({
        author_id: state.currentUser.id, author_name: state.currentUser.name, text
      }).select('id,created_at').single();
      if(error){ showMessage(error.message); return; }
      state.messages.unshift({ id:data.id, author:state.currentUser.name, text, ts:new Date(data.created_at).getTime() });
      if(state.messages.length>150) state.messages=state.messages.slice(0,150);
      ta.value='';
      drawMessages();
    };
  }
  drawMessages();
}

function drawProfielInto(body){
  const u=state.currentUser;
  body.innerHTML=`
    <div class="info-line"><div class="il-label">Naam</div><div class="il-value">${escapeHtml(u.name)}</div></div>
    <div class="info-line"><div class="il-label">E-mailadres</div><div class="il-value">${escapeHtml(u.email)}</div></div>
    <div class="info-line"><div class="il-label">Rol</div><div class="il-value">${u.isAdmin?'Administrator':'Medewerker'}</div></div>
    <h2 class="section-title" style="margin:20px 16px 10px;">Wachtwoord wijzigen</h2>
    <div class="card" style="margin:0 16px 16px;">
      <label class="field-label" style="margin-top:0;">Nieuw wachtwoord</label>
      <input type="password" id="pwNew1" placeholder="Minstens 6 tekens">
      <label class="field-label">Bevestig nieuw wachtwoord</label>
      <input type="password" id="pwNew2" placeholder="Herhaal wachtwoord">
      <div class="err-msg" id="pwErr" style="display:none;"></div>
      <div class="info-msg" id="pwOk" style="display:none;"></div>
      <button class="btn-primary" id="pwSaveBtn">Wachtwoord opslaan</button>
    </div>
  `;
  document.getElementById('pwSaveBtn').onclick=async ()=>{
    const errEl=document.getElementById('pwErr'); const okEl=document.getElementById('pwOk');
    errEl.style.display='none'; okEl.style.display='none';
    const p1=document.getElementById('pwNew1').value;
    const p2=document.getElementById('pwNew2').value;
    if(p1.length<6){ errEl.textContent='Wachtwoord moet minstens 6 tekens zijn.'; errEl.style.display='block'; return; }
    if(p1!==p2){ errEl.textContent='Wachtwoorden komen niet overeen.'; errEl.style.display='block'; return; }
    const { error: pwErr } = await sb.auth.updateUser({ password: p1 });
    if(pwErr){ errEl.textContent='Kon wachtwoord niet aanpassen: '+pwErr.message; errEl.style.display='block'; return; }
    okEl.textContent='Wachtwoord aangepast.'; okEl.style.display='block';
    document.getElementById('pwNew1').value=''; document.getElementById('pwNew2').value='';
  };
}


init();
</script>
</body>
</html>
